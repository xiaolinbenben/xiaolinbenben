name: generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg

      - name: remove progress bar
        run: |
          sudo chown -R $(id -u):$(id -g) dist
          for f in dist/*.svg; do
            sed -i -E 's/viewBox="(-?[0-9.]+) (-?[0-9.]+) ([0-9.]+) ([0-9.]+)" width="([0-9.]+)" height="([0-9.]+)"/viewBox="\1 -16 \3 144" width="\5" height="144"/' "$f"
            sed -i 's#</style>#.u{display:none}</style>#' "$f"
          done

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
